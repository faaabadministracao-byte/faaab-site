name: Build CEFET Reta Final v0.22

on:
  push:
    branches:
      - build/cefet-trainer-014
  workflow_dispatch:

jobs:
  build-v22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore base app
        shell: bash
        run: |
          cat cefet-clean/chunk00 cefet-clean/chunk01 cefet-clean/chunk02 cefet-clean/chunk03 cefet-clean/chunk04a0 cefet-clean/chunk04a1p0 cefet-clean/chunk04a1p1 cefet-clean/chunk04b cefet-clean/chunk05a cefet-clean/chunk05b cefet-clean/chunk06a cefet-clean/chunk06b cefet-clean/chunk07 cefet-clean/chunk08 > clean.b64
          test "$(wc -c < clean.b64)" -eq 74436
          echo '852a994ca79e906786b13ff85d955f8d40ee2ea893bca9041dee2b6f0ce623d7  clean.b64' | sha256sum -c -
          base64 -d clean.b64 > clean.tar.gz
          echo '48f24d6b1150c282e37e1bf51b0a0b09b2882c95ce053687d014a698b6aa4997  clean.tar.gz' | sha256sum -c -
          mkdir cefet-trainer
          tar -xzf clean.tar.gz -C cefet-trainer

      - name: Restore v0.22 curriculum engine
        shell: bash
        run: |
          cat cefet-v22/q00 cefet-v22/q01 cefet-v22/q02 cefet-v22/q03 cefet-v22/q04 cefet-v22/q05 cefet-v22/q06 cefet-v22/q07 > v22.b64
          test "$(wc -c < v22.b64)" -eq 34732
          echo 'd7c63f0990c466a0411ce27f2349ef2cdf77bd57bf5c95447334a23c16a9e48e  v22.b64' | sha256sum -c -
          base64 -d v22.b64 > v22.tar.gz
          test "$(wc -c < v22.tar.gz)" -eq 26048
          echo 'f3a63f1fcbc6f8c7134b45e8212c9cfa8b7d2ae2eae9f93c1765d84b9a7494c2  v22.tar.gz' | sha256sum -c -
          mkdir /tmp/v22
          tar -xzf v22.tar.gz -C /tmp/v22
          cp /tmp/v22/upgrade-v22.js cefet-trainer/app/src/main/assets/
          cp /tmp/v22/upgrade-v22.css cefet-trainer/app/src/main/assets/
          echo '9192275f8421e28642be613c2eaf2cc10fe6f0435e0a519ade801cd7c4b88456  cefet-trainer/app/src/main/assets/upgrade-v22.js' | sha256sum -c -
          echo 'aa751389f11290c1dc6f2e68b94938ece8771e2ca46f418d308860f0c009f7b2  cefet-trainer/app/src/main/assets/upgrade-v22.css' | sha256sum -c -
          node --check cefet-trainer/app/src/main/assets/upgrade-v22.js

      - name: Configure app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('cefet-trainer/app/src/main/assets/upgrade-v22.js')
          z=js.read_text(encoding='utf-8')
          a=z.index('const MODULES=')+len('const MODULES=')
          mpos=z.index('const MOD=',a)
          b=z.rfind(';',a,mpos)
          import json
          mods=json.loads(z[a:b])
          fixes={
            'M-EQ-1':'Isolando x: 3x=18. Dividindo os dois lados por 3, obtemos x=6.',
            'M-EQ-2':'Fatorando x²−7x+12, temos (x−3)(x−4)=0; logo, x=3 ou x=4.',
            'M-FUNC-1':'Substitua x por 4: f(4)=3·4+2=12+2=14.',
            'M-FUNC-2':'Para achar a raiz, faça f(x)=0: −2x+8=0, então −2x=−8 e x=4.',
            'M-FUNC-3':'A equação x²−9=0 equivale a x²=9; portanto, as raízes são x=3 e x=−3.',
            'M-GEO-3':'A área do círculo é A=πr². Com r=4, A=π·4²=16π.',
            'M-TRI-1':'Pelo Teorema de Pitágoras, h²=9²+12²=225; então h=√225=15.',
            'M-TRI-2':'Os triângulos são semelhantes: 4/10=6/x. Fazendo o produto cruzado, 4x=60 e x=15.',
            'M-ESP-1':'O volume do paralelepípedo é comprimento×largura×altura: 5×4×3=60 cm³.',
            'F-MEC-1':'Velocidade média é distância dividida pelo tempo: v=180/3=60 km/h.',
            'F-ENE-1':'Potência é trabalho dividido pelo intervalo de tempo: P=900/3=300 W.',
            'F-WAVE-1':'Usando v=λf, isolamos λ=v/f. Assim, λ=20/5=4 m.',
            'F-ELEC-1':'Pela Lei de Ohm, U=RI. Logo I=U/R=20/5=4 A.',
            'Q-ATOM-1':'O número de nêutrons é N=A−Z. Portanto, N=40−18=22.'
          }
          for mod in mods:
              if mod['id']=='M-NUM':
                  mod['lesson']=mod['lesson'].replace('radiciação é a operação inversa','A radiciação é a operação inversa')
              for q in mod['questions']:
                  if q['id'] in fixes:
                      q['explain']=fixes[q['id']]
          z=z[:a]+json.dumps(mods,ensure_ascii=False,separators=(',',':'))+z[b:]
          js.write_text(z,encoding='utf-8')

          p=Path('cefet-trainer/app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          assert '"trail_count":210' in h
          h=h.replace('</head>','<link rel="stylesheet" href="upgrade-v22.css"></head>',1)
          h=h.replace('</body>','<script src="upgrade-v22.js"></script></body>',1)
          p.write_text(h,encoding='utf-8')
          g=Path('cefet-trainer/app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r'applicationId\s+["\']br\.com\.cefettrainer\.app["\']', "applicationId 'br.com.cefettrainer.retafinal22'", t)
          t=re.sub(r'versionCode\s+\d+', 'versionCode 220', t)
          t=re.sub(r'versionName\s+["\'][^"\']+["\']', "versionName '0.22.0'", t)
          g.write_text(t,encoding='utf-8')
          m=Path('cefet-trainer/app/src/main/AndroidManifest.xml')
          u=m.read_text(encoding='utf-8')
          u=u.replace('CEFET Trainer 2027','CEFET Reta Final 2027').replace('CEFET Trainer','CEFET Reta Final 2027')
          m.write_text(u,encoding='utf-8')
          PY

      - name: Audit content
        shell: bash
        run: |
          grep -q 'Conteúdo = programa oficial 2027' cefet-trainer/app/src/main/assets/upgrade-v22.js
          grep -q 'explicação primeiro' cefet-trainer/app/src/main/assets/upgrade-v22.js
          grep -q 'A radiciação é a operação inversa' cefet-trainer/app/src/main/assets/upgrade-v22.js
          grep -q 'Brasil Colonial: trabalho, açúcar e mineração' cefet-trainer/app/src/main/assets/upgrade-v22.js
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('cefet-trainer/app/src/main/assets/upgrade-v22.js').read_text(encoding='utf-8')
          a=s.index('const MODULES=')+len('const MODULES=')
          mpos=s.index('const MOD=',a)
          b=s.rfind(';',a,mpos)
          mods=json.loads(s[a:b])
          assert len(mods)==35
          qs=[q for m in mods for q in m['questions']]
          assert len(qs)==86
          assert len({q['id'] for q in qs})==86
          assert len({q['prompt'] for q in qs})==86
          assert all(len(q['options'])==4 and q['answer'] in q['options'] and len(q['explain'])>=25 for q in qs)
          assert all(len(m['lesson'])>=100 and len(m['method'])>=80 and len(m['example'])>=40 for m in mods)
          subjects={m['subject'] for m in mods}
          assert subjects=={'Português','Matemática','Física','Química','Biologia','História','Geografia'}
          history=' '.join(m['title']+' '+m['official'] for m in mods if m['subject']=='História').lower()
          for banned in ['era vargas','ditadura militar','primeira guerra mundial','segunda guerra mundial','república velha','independência do brasil']:
              assert banned not in history,banned
          assert 'expansão marítima' in history and 'mercantilismo' in history and 'brasil colonial' in history
          print('audit ok:',len(mods),'modules',len(qs),'questions')
          PY

      - name: Build APK
        working-directory: cefet-trainer
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          cp cefet-trainer/app/build/outputs/apk/debug/app-debug.apk CEFET_Reta_Final_2027_v0.22.0.apk
          unzip -t CEFET_Reta_Final_2027_v0.22.0.apk >/dev/null
          unzip -p CEFET_Reta_Final_2027_v0.22.0.apk assets/upgrade-v22.js | grep -q 'Conteúdo = programa oficial 2027'
          unzip -p CEFET_Reta_Final_2027_v0.22.0.apk assets/upgrade-v22.js | grep -q 'A radiciação é a operação inversa'
          sha256sum CEFET_Reta_Final_2027_v0.22.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CEFET_Reta_Final_2027_v0.22.0
          path: CEFET_Reta_Final_2027_v0.22.0.apk
          if-no-files-found: error
