name: Build CEFET Caderno v0.18

on:
  push:
    branches:
      - build/cefet-trainer-014
  workflow_dispatch:

jobs:
  build-v18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore base app
        shell: bash
        run: |
          cat \
            cefet-clean/chunk00 \
            cefet-clean/chunk01 \
            cefet-clean/chunk02 \
            cefet-clean/chunk03 \
            cefet-clean/chunk04a0 \
            cefet-clean/chunk04a1p0 \
            cefet-clean/chunk04a1p1 \
            cefet-clean/chunk04b \
            cefet-clean/chunk05a \
            cefet-clean/chunk05b \
            cefet-clean/chunk06a \
            cefet-clean/chunk06b \
            cefet-clean/chunk07 \
            cefet-clean/chunk08 > clean.b64
          test "$(wc -c < clean.b64)" -eq 74436
          echo '852a994ca79e906786b13ff85d955f8d40ee2ea893bca9041dee2b6f0ce623d7  clean.b64' | sha256sum -c -
          base64 -d clean.b64 > clean.tar.gz
          echo '48f24d6b1150c282e37e1bf51b0a0b09b2882c95ce053687d014a698b6aa4997  clean.tar.gz' | sha256sum -c -
          mkdir -p cefet-trainer
          tar -xzf clean.tar.gz -C cefet-trainer

      - name: Restore realistic exam bank
        shell: bash
        run: |
          cat \
            cefet-v16-patch/c00 \
            cefet-v16-patch/c01 \
            cefet-v16-patch/c02 \
            cefet-v16-patch/c03 \
            cefet-v16-patch/c04 \
            cefet-v16-patch/c05 \
            cefet-v16-patch/c06 \
            cefet-v16-patch/c07 \
            cefet-v16-patch/c08 \
            cefet-v16-patch/c09 \
            cefet-v16-patch/c10 \
            cefet-v16-patch/c11 \
            cefet-v16-patch/c12 \
            cefet-v16-patch/c13 \
            cefet-v16-patch/c14 \
            cefet-v16-patch/c15 \
            cefet-v16-patch/c16 \
            cefet-v16-patch/c17 \
            cefet-v16-patch/c18 \
            cefet-v16-patch/c19 \
            cefet-v16-patch/c20 > v16.b64
          test "$(wc -c < v16.b64)" -eq 32072
          base64 -d v16.b64 > v16.tar.gz
          mkdir -p /tmp/v16
          tar -xzf v16.tar.gz -C /tmp/v16
          cp /tmp/v16/upgrade-v16.js cefet-trainer/app/src/main/assets/

      - name: Restore v0.18 engine
        shell: bash
        run: |
          cat \
            cefet-v18/chunk00 \
            cefet-v18/chunk01 \
            cefet-v18/chunk02 \
            cefet-v18/chunk03 \
            cefet-v18/chunk04 \
            cefet-v18/chunk05 \
            cefet-v18/chunk06 \
            cefet-v18/chunk07 \
            cefet-v18/chunk08 > v18.b64
          test "$(wc -c < v18.b64)" -eq 11212
          echo 'f699fb8a10dfc35b549862355ca8f10da956ed15c3ca248c81cc23738717032d  v18.b64' | sha256sum -c -
          base64 -d v18.b64 > v18.tar.gz
          test "$(wc -c < v18.tar.gz)" -eq 8409
          echo '050b80710052b954f61706cb640224428fe68eadcde4d5e0343d97ebd8ff3cd7  v18.tar.gz' | sha256sum -c -
          mkdir -p /tmp/v18
          tar -xzf v18.tar.gz -C /tmp/v18
          cp /tmp/v18/upgrade-v18.js cefet-trainer/app/src/main/assets/
          cp /tmp/v18/upgrade-v18.css cefet-trainer/app/src/main/assets/
          node --check cefet-trainer/app/src/main/assets/upgrade-v18.js

      - name: Assemble single interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('cefet-trainer/app/src/main/assets/upgrade-v16.js')
          s=a.read_text(encoding='utf-8')
          marker="const oldDB=JSON.parse(document.getElementById('db').textContent);"
          assert marker in s
          s=s.replace(marker,"window.__CEFET_BANK=B; return;",1)
          a.write_text(s,encoding='utf-8')

          p=Path('cefet-trainer/app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          assert '"trail_count":210' in h
          h=h.replace('</head>','<link rel="stylesheet" href="upgrade-v18.css"></head>',1)
          h=h.replace('</body>','<script src="upgrade-v16.js"></script><script src="upgrade-v18.js"></script></body>',1)
          p.write_text(h,encoding='utf-8')

          g=Path('cefet-trainer/app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r'applicationId\s+["\']br\.com\.cefettrainer\.app["\']', "applicationId 'br.com.cefettrainer.caderno18'", t)
          t=re.sub(r'versionCode\s+\d+', 'versionCode 180', t)
          t=re.sub(r'versionName\s+["\'][^"\']+["\']', "versionName '0.18.0'", t)
          g.write_text(t,encoding='utf-8')

          m=Path('cefet-trainer/app/src/main/AndroidManifest.xml')
          u=m.read_text(encoding='utf-8')
          u=u.replace('CEFET Trainer 2027','CEFET Caderno 2027').replace('CEFET Trainer','CEFET Caderno 2027')
          m.write_text(u,encoding='utf-8')
          PY

      - name: Audit curriculum and lesson roles
        shell: bash
        run: |
          grep -q 'O que é este assunto' cefet-trainer/app/src/main/assets/upgrade-v18.js
          grep -q 'Estratégia para resolver questões' cefet-trainer/app/src/main/assets/upgrade-v18.js
          grep -q 'Texto-base das questões' cefet-trainer/app/src/main/assets/upgrade-v18.js
          grep -q 'exampleIsMeta' cefet-trainer/app/src/main/assets/upgrade-v18.js
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('cefet-trainer/app/src/main/assets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="db" type="application/json">(.*?)</script>',h,re.S)
          assert m
          db=json.loads(m.group(1))
          trails=list(db['trails'].values())
          assert len(trails)==210
          expected={'Português':45,'Matemática':50,'Física':20,'Química':18,'Biologia':22,'História':30,'Geografia':25}
          got={x:sum(t['subject']==x for t in trails) for x in expected}
          assert got==expected
          meta=0
          for t in trails:
              cp=next(x for x in t['steps'] if x['kind']=='checkpoint')
              ex=next(x for x in t['steps'] if x['kind']=='example')['content']
              assert len(cp['options'])==4 and cp['answer'] in cp['options'] and cp.get('explanation')
              if ex.lower().startswith('exemplo guiado:'):
                  meta+=1
          assert meta>=150
          s=Path('cefet-trainer/app/src/main/assets/upgrade-v16.js').read_text(encoding='utf-8')
          a=s.index('const B=')+len('const B=')
          b=s.index(';\nwindow.__CEFET_BANK=B; return;',a)
          bank=json.loads(s[a:b])
          assert len(bank['exams'])==2
          for exam in bank['exams']:
              assert len(exam['questions'])==30
              stims=[q.get('stim') for q in exam['questions'] if q.get('stim')]
              counts={x:stims.count(x) for x in set(stims)}
              assert any(v>=3 for v in counts.values())
          print('Audit OK:',got,'meta examples hidden:',meta)
          PY

      - name: Build APK
        working-directory: cefet-trainer
        run: gradle --no-daemon clean assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          cp cefet-trainer/app/build/outputs/apk/debug/app-debug.apk CEFET_Caderno_2027_v0.18.0.apk
          unzip -t CEFET_Caderno_2027_v0.18.0.apk >/dev/null
          unzip -p CEFET_Caderno_2027_v0.18.0.apk assets/upgrade-v18.js | grep -q 'Texto-base das questões'
          unzip -p CEFET_Caderno_2027_v0.18.0.apk assets/upgrade-v18.js | grep -q 'O que é este assunto'
          sha256sum CEFET_Caderno_2027_v0.18.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET_Caderno_2027_v0.18.0
          path: CEFET_Caderno_2027_v0.18.0.apk
          if-no-files-found: error
