name: Build FAAAB Media Downloader APK

on:
  push:
    branches:
      - build-faaab-downloader-apk
    paths:
      - 'faaab-downloader-android/**'
      - '.github/workflows/build-faaab-downloader-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p faaab-downloader-android :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp faaab-downloader-android/app/build/outputs/apk/debug/app-debug.apk FAAAB-Media-Downloader-v2.2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FAAAB-Media-Downloader-v2.2.0
          path: FAAAB-Media-Downloader-v2.2.0.apk
          if-no-files-found: error
