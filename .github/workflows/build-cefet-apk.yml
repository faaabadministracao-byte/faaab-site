name: Build CEFET Trainer APK

on:
  push:
    branches:
      - build/cefet-trainer-014
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified base project
        shell: bash
        run: |
          cat \
            cefet-clean/chunk00 \
            cefet-clean/chunk01 \
            cefet-clean/chunk02 \
            cefet-clean/chunk03 \
            cefet-clean/chunk04a0 \
            cefet-clean/chunk04a1p0 \
            cefet-clean/chunk04a1p1 \
            cefet-clean/chunk04b \
            cefet-clean/chunk05a \
            cefet-clean/chunk05b \
            cefet-clean/chunk06a \
            cefet-clean/chunk06b \
            cefet-clean/chunk07 \
            cefet-clean/chunk08 > clean.b64
          test "$(wc -c < clean.b64)" -eq 74436
          echo '852a994ca79e906786b13ff85d955f8d40ee2ea893bca9041dee2b6f0ce623d7  clean.b64' | sha256sum -c -
          base64 -d clean.b64 > clean.tar.gz
          echo '48f24d6b1150c282e37e1bf51b0a0b09b2882c95ce053687d014a698b6aa4997  clean.tar.gz' | sha256sum -c -
          mkdir -p cefet-trainer
          tar -xzf clean.tar.gz -C cefet-trainer

      - name: Restore verified realistic exam bank and signing key
        shell: bash
        run: |
          cat \
            cefet-v16-patch/c00 \
            cefet-v16-patch/c01 \
            cefet-v16-patch/c02 \
            cefet-v16-patch/c03 \
            cefet-v16-patch/c04 \
            cefet-v16-patch/c05 \
            cefet-v16-patch/c06 \
            cefet-v16-patch/c07 \
            cefet-v16-patch/c08 \
            cefet-v16-patch/c09 \
            cefet-v16-patch/c10 \
            cefet-v16-patch/c11 \
            cefet-v16-patch/c12 \
            cefet-v16-patch/c13 \
            cefet-v16-patch/c14 \
            cefet-v16-patch/c15 \
            cefet-v16-patch/c16 \
            cefet-v16-patch/c17 \
            cefet-v16-patch/c18 \
            cefet-v16-patch/c19 \
            cefet-v16-patch/c20 > v16.b64
          test "$(wc -c < v16.b64)" -eq 32072
          echo '369b022aae1bad32f73f4885f918ec288c36d58cd06061b63d2837f9741c5882  v16.b64' | sha256sum -c -
          base64 -d v16.b64 > v16.tar.gz
          echo 'b13d81415f0f7934487a8aa959d9592bc9aa91588881eeefab458187dd883cd2  v16.tar.gz' | sha256sum -c -
          rm -rf /tmp/v16
          mkdir -p /tmp/v16
          tar -xzf v16.tar.gz -C /tmp/v16
          cp /tmp/v16/upgrade-v16.js cefet-trainer/app/src/main/assets/
          cp /tmp/v16/cefet-dev.keystore cefet-trainer/app/cefet-dev.keystore
          echo 'a2e47b3a09ce4d0f7b3450197c30bbd70c662bac360e48d8660832ffd5459099  cefet-trainer/app/src/main/assets/upgrade-v16.js' | sha256sum -c -
          echo '51f8e142fee92e3f7f6b422a42836d68c303589e3cba1ecd0ffd7dad77583acc  cefet-trainer/app/cefet-dev.keystore' | sha256sum -c -

      - name: Install v0.17 single interface engine
        shell: bash
        run: |
          cp cefet-v17/upgrade-v17.js cefet-trainer/app/src/main/assets/
          cp cefet-v17/upgrade-v17.css cefet-trainer/app/src/main/assets/
          node --check cefet-trainer/app/src/main/assets/upgrade-v17.js
          grep -q 'ESTUDAR O PROGRAMA' cefet-trainer/app/src/main/assets/upgrade-v17.js
          grep -q 'visual de caderno' cefet-trainer/app/src/main/assets/upgrade-v17.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          a=Path('cefet-trainer/app/src/main/assets/upgrade-v16.js')
          s=a.read_text(encoding='utf-8')
          old="const oldDB=JSON.parse(document.getElementById('db').textContent);"
          assert old in s
          s=s.replace(old,"window.__CEFET_BANK=B; return;",1)
          a.write_text(s,encoding='utf-8')

          p=Path('cefet-trainer/app/src/main/assets/index.html')
          h=p.read_text(encoding='utf-8')
          assert '"trail_count":210' in h
          h=h.replace('</head>','<link rel="stylesheet" href="upgrade-v17.css"></head>',1)
          h=h.replace('</body>','<script src="upgrade-v16.js"></script><script src="upgrade-v17.js"></script></body>',1)
          p.write_text(h,encoding='utf-8')

          g=Path('cefet-trainer/app/build.gradle')
          t=g.read_text(encoding='utf-8')
          t=re.sub(r'applicationId\s+["\']br\.com\.cefettrainer\.app["\']', "applicationId 'br.com.cefettrainer.realista'", t)
          t=re.sub(r'versionCode\s+\d+', 'versionCode 170', t)
          t=re.sub(r'versionName\s+["\'][^"\']+["\']', "versionName '0.17.0'", t)
          g.write_text(t,encoding='utf-8')

          m=Path('cefet-trainer/app/src/main/AndroidManifest.xml')
          u=m.read_text(encoding='utf-8')
          u=u.replace('CEFET Trainer 2027','CEFET Caderno 2027').replace('CEFET Trainer','CEFET Caderno 2027')
          m.write_text(u,encoding='utf-8')
          PY

      - name: Audit curriculum and simulations
        shell: bash
        run: |
          node --check cefet-trainer/app/src/main/assets/upgrade-v16.js
          node --check cefet-trainer/app/src/main/assets/upgrade-v17.js
          grep -q 'Agora tente sem gabarito' cefet-trainer/app/src/main/assets/upgrade-v17.js
          grep -q 'window.__CEFET_BANK=B; return;' cefet-trainer/app/src/main/assets/upgrade-v16.js
          grep -q "versionName '0.17.0'" cefet-trainer/app/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          h=Path('cefet-trainer/app/src/main/assets/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="db" type="application/json">(.*?)</script>',h,re.S)
          assert m
          db=json.loads(m.group(1))
          trails=list(db['trails'].values())
          assert len(trails)==210
          expected={'Português':45,'Matemática':50,'Física':20,'Química':18,'Biologia':22,'História':30,'Geografia':25}
          got={s:sum(t['subject']==s for t in trails) for s in expected}
          assert got==expected,(got,expected)
          for t in trails:
              cp=next(x for x in t['steps'] if x['kind']=='checkpoint')
              assert len(cp['options'])==4
              assert cp['answer'] in cp['options']
              assert cp.get('explanation')
              assert next(x for x in t['steps'] if x['kind']=='goal').get('content')
              assert next(x for x in t['steps'] if x['kind']=='understand').get('content')
          s=Path('cefet-trainer/app/src/main/assets/upgrade-v16.js').read_text(encoding='utf-8')
          a=s.index('const B=')+len('const B=')
          b=s.index(';\nwindow.__CEFET_BANK=B; return;',a)
          bank=json.loads(s[a:b])
          assert len(bank['exams'])==2
          for exam in bank['exams']:
              qs=exam['questions']
              assert len(qs)==30
              assert [q['subject'] for q in qs[:10]]==['Português']*10
              assert [q['subject'] for q in qs[10:20]]==['Matemática']*10
              assert [q['subject'] for q in qs[20:25]]==['Ciências da Natureza']*5
              assert [q['subject'] for q in qs[25:30]]==['Ciências Humanas']*5
              assert all(len(q['options'])==4 and q['answer'] in q['options'] and q['explain'] for q in qs)
          assert len({q['prompt'] for e in bank['exams'] for q in e['questions']})==60
          print('Curriculum audit OK:',got,'| simulations: 60 questions')
          PY

      - name: Build APK
        working-directory: cefet-trainer
        run: gradle --no-daemon clean assembleDebug

      - name: Sign and validate APK
        shell: bash
        run: |
          test -f cefet-trainer/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks cefet-trainer/app/cefet-dev.keystore \
            --ks-key-alias cefettrainer \
            --ks-pass pass:cefet2027 \
            --key-pass pass:cefet2027 \
            --out CEFET_Caderno_2027_v0.17.0.apk \
            cefet-trainer/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs CEFET_Caderno_2027_v0.17.0.apk | tee signer.txt
          grep -q 'CN=CEFET Trainer Dev' signer.txt
          unzip -t CEFET_Caderno_2027_v0.17.0.apk >/dev/null
          unzip -p CEFET_Caderno_2027_v0.17.0.apk assets/upgrade-v17.js | grep -q 'ESTUDAR O PROGRAMA'
          unzip -p CEFET_Caderno_2027_v0.17.0.apk assets/index.html | grep -q '"trail_count":210'
          sha256sum CEFET_Caderno_2027_v0.17.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET_Caderno_2027_v0.17.0
          path: CEFET_Caderno_2027_v0.17.0.apk
          if-no-files-found: error
