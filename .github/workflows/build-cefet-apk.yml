name: Build CEFET Trainer APK

on:
  push:
    branches:
      - build/cefet-trainer-014
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore verified clean Android project
        shell: bash
        run: |
          cat \
            cefet-clean/chunk00 \
            cefet-clean/chunk01 \
            cefet-clean/chunk02 \
            cefet-clean/chunk03 \
            cefet-clean/chunk04a0 \
            cefet-clean/chunk04a1 \
            cefet-clean/chunk04b \
            cefet-clean/chunk05a \
            cefet-clean/chunk05b \
            cefet-clean/chunk06a \
            cefet-clean/chunk06b \
            cefet-clean/chunk07 \
            cefet-clean/chunk08 > clean.b64
          test "$(wc -c < clean.b64)" -eq 74436
          echo '852a994ca79e906786b13ff85d955f8d40ee2ea893bca9041dee2b6f0ce623d7  clean.b64' | sha256sum -c -
          base64 -d clean.b64 > clean.tar.gz
          test "$(wc -c < clean.tar.gz)" -eq 55827
          echo '48f24d6b1150c282e37e1bf51b0a0b09b2882c95ce053687d014a698b6aa4997  clean.tar.gz' | sha256sum -c -
          gzip -t clean.tar.gz
          mkdir -p cefet-trainer
          tar -xzf clean.tar.gz -C cefet-trainer
          test -f cefet-trainer/app/src/main/assets/index.html
          test -f cefet-trainer/app/src/main/java/br/com/cefettrainer/app/MainActivity.java

      - name: Verify CEFET study bank
        shell: bash
        run: |
          grep -q 'CEFET Trainer 2027' cefet-trainer/app/src/main/assets/index.html
          grep -q '"trail_count":210' cefet-trainer/app/src/main/assets/index.html
          grep -q 'Simulado real' cefet-trainer/app/src/main/assets/index.html
          grep -q 'corrige na hora' cefet-trainer/app/src/main/assets/index.html

      - name: Build APK
        working-directory: cefet-trainer
        run: gradle --no-daemon clean assembleDebug

      - name: Validate and rename APK
        shell: bash
        run: |
          test -f cefet-trainer/app/build/outputs/apk/debug/app-debug.apk
          cp cefet-trainer/app/build/outputs/apk/debug/app-debug.apk CEFET_Trainer_2027_v0.14.0.apk
          unzip -t CEFET_Trainer_2027_v0.14.0.apk >/dev/null
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose CEFET_Trainer_2027_v0.14.0.apk
          sha256sum CEFET_Trainer_2027_v0.14.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET_Trainer_2027_v0.14.0
          path: CEFET_Trainer_2027_v0.14.0.apk
          if-no-files-found: error
