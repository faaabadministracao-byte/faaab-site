plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faaab.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.faaab.downloader'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '2.3.1'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
